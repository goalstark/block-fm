name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 게임 빌드(난독화 포함)
        run: |
          npm install --no-save javascript-obfuscator@4.1.1
          BFM_OBF=1 node build.js
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Keep screen on
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          sed -i 's/super.onCreate(b); applyFs();/super.onCreate(b); getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); applyFs();/' "$f"
          grep -c FLAG_KEEP_SCREEN_ON "$f"
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: APK 서명 지문·최소 안드로이드 버전 확인
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "== APK 서명 지문 (폰의 앱과 같아야 덮어 설치됨) =="
          "$BT/apksigner" verify --print-certs "$APK" > certs.txt 2>&1 || true
          "$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^(min)?[sS]dkVersion|^targetSdkVersion|^package" > sdk.txt || true
          { echo '### APK 확인'; echo '```'; echo "build-tools: $BT"; cat certs.txt; cat sdk.txt; grep -n "minSdkVersion" android/variables.gradle; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat certs.txt sdk.txt
          # 최소 버전 7.0부터는 v2 서명만 들어가서 keytool -printcert 로는 못 읽음 → apksigner 사용
          grep -qi "365952c4f3799e5136acf3b2d8c3bd3e6dbbcbdb076f26a0315c5920a4b520a8" certs.txt || { echo "서명 키가 기존 앱과 다름 — 배포 중단"; exit 1; }
          grep -Eq "(minSdkVersion|^sdkVersion):'24'" sdk.txt || { echo "최소 버전이 24(안드로이드 7.0)가 아님"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: football-sim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'   # 정식 릴리스(latest)는 main에서만. 다른 브랜치는 위 artifact로만 APK를 받음
        with:
          repository: goalstark/bfm-download   # 배포용 공개 저장소(코드 저장소는 비공개 예정)
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: latest
          name: Block FM APK (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
