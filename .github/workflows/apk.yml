name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: node src/build.js
      - run: npm install
      - run: npx cap add android
      - name: Keep screen on
        run: |
          python3 - <<'PY'
          import glob
          f = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)[0]
          s = open(f).read()
          s = s.replace('extends BridgeActivity {', 'extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle b) {\n        super.onCreate(b);\n        getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n    }\n', 1)
          open(f, 'w').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: football-sim-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
