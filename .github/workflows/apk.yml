name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node build.js
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Keep screen on
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          sed -i 's/super.onCreate(b); applyFs();/super.onCreate(b); getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); applyFs();/' "$f"
          grep -c FLAG_KEEP_SCREEN_ON "$f"
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: APK 서명 지문 출력
        run: |
          echo "== APK 서명 지문 (폰의 앱과 같아야 덮어 설치됨) =="
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA256|Valid"
          echo "== 고정 키 지문 =="
          grep -c "androiddebugkey" patch-android.js || true
      - uses: actions/upload-artifact@v4
        with:
          name: football-sim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Block FM APK (latest)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
