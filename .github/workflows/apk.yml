{"name": "Build APK", "on": ["workflow_dispatch", "push"], "jobs": {"build": {"runs-on": "ubuntu-latest", "permissions": {"contents": "write"}, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 20}}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 17}}, {"run": "node build.js"}, {"run": "npm install"}, {"run": "npx cap add android"}, {"run": "npx cap sync android"}, {"run": "cd android && chmod +x gradlew && ./gradlew assembleDebug"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "football-sim-apk", "path": "android/app/build/outputs/apk/debug/app-debug.apk"}}, {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "latest", "name": "Block FM APK (latest)", "files": "android/app/build/outputs/apk/debug/app-debug.apk", "make_latest": true}}]}}}
